services:
  postgres:
    image: postgres:16-alpine
    container_name: settleiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-settleiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-settleiq_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-settleiq_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/settleiq/persistence/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-settleiq} -d ${POSTGRES_DB:-settleiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - settleiq-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: settleiq-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SETTLEIQ_DB_PATH: "postgresql://${POSTGRES_USER:-settleiq}:${POSTGRES_PASSWORD:-settleiq_secure_pass}@postgres:5432/${POSTGRES_DB:-settleiq_db}"
      SETTLEIQ_API_KEY: ${SETTLEIQ_API_KEY:-settleiq-secret-api-key}
      ENVIRONMENT: "production"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - settleiq-network

volumes:
  pgdata:
    driver: local

networks:
  settleiq-network:
    driver: bridge

