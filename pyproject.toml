[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settleiq"
version = "0.1.0"
description = "Payment settlement reconciliation and discrepancy investigation engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: unit tests",
    "property: property-based tests with a recorded seed",
    "golden: golden-file serialization tests",
    "determinism: byte-identical output tests",
    "integration: database and API integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]
# PLR and C90 complexity are intentionally excluded: the matching engine is
# allowed to be explicit rather than clever.

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_money.py" = ["B015"]
"scripts/verify_ui_workflow.py" = ["E501"]
"scripts/capture_proof.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true
