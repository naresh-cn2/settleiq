name: SettleIQ Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test, and Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: settleiq_test
          POSTGRES_USER: settleiq
          POSTGRES_PASSWORD: settleiq_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Money-Safety Gate (Zero Float AST Enforcer)
        run: python -m settleiq.cli gate

      - name: Run Ruff Linter
        run: python -m ruff check src tests

      - name: Run Pytest Test Suite
        env:
          SETTLEIQ_TEST_POSTGRES_URL: postgresql://settleiq:settleiq_password@localhost:5432/settleiq_test
        run: pytest -v

      - name: Run CLI Demonstration
        run: python -m settleiq.cli run

      - name: Build React Dashboard Frontend
        working-directory: ./frontend
        run: npm run build

